<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fiverr Price Hider</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 240px;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      user-select: none;
    }

    .container {
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .logo {
      width: 28px;
      height: 28px;
      background: #1dbf73;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .title {
      font-size: 13px;
      font-weight: 600;
      color: #f0f0f0;
      letter-spacing: 0.01em;
    }

    .subtitle {
      font-size: 10px;
      color: #666;
      margin-top: 1px;
      letter-spacing: 0.02em;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 14px 16px;
    }

    .toggle-label {
      font-size: 12px;
      font-weight: 500;
      color: #ccc;
    }

    .toggle-status {
      font-size: 10px;
      color: #555;
      margin-top: 2px;
    }

    /* Toggle switch */
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 3px;
      background: #888;
      border-radius: 50%;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    input:checked + .slider {
      background: #1dbf73;
    }

    input:checked + .slider::before {
      transform: translateX(18px);
      background: #fff;
    }

    .footer {
      margin-top: 14px;
      font-size: 10px;
      color: #3a3a3a;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">$</div>
      <div>
        <div class="title">Price Hider</div>
        <div class="subtitle">fiverr.com only</div>
      </div>
    </div>

    <div class="toggle-row">
      <div>
        <div class="toggle-label">Hide Prices</div>
        <div class="toggle-status" id="status-text">Loading...</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="footer">Reload the page to restore hidden prices.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
